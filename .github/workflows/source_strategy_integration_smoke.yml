name: Source strategy integration smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout AstraQuant
        uses: actions/checkout@v4
        with:
          path: AstraQuant

      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          repository: bibobo2266/minervini_picks
          token: ${{ secrets.MINERVINI_READ_TOKEN }}
          path: source_runtime/minervini_picks
          persist-credentials: false

      - name: Make source checkout filesystem read-only
        run: chmod -R a-w source_runtime/minervini_picks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AstraQuant
        working-directory: AstraQuant
        run: python -m pip install --quiet -e .

      - name: Run canonical strategy integration smoke
        working-directory: AstraQuant
        env:
          SOURCE_ROOT: ../source_runtime/minervini_picks/data
          REPORT_PATH: docs/SOURCE_STRATEGY_INTEGRATION_SMOKE.md
          SIGNAL_START: "2026-01-01"
          SIGNAL_END: "2026-03-31"
        run: python scripts/source_strategy_integration_smoke.py

      - name: Publish summary
        if: always()
        working-directory: AstraQuant
        shell: bash
        run: |
          if [ -f docs/SOURCE_STRATEGY_INTEGRATION_SMOKE.md ]; then
            cat docs/SOURCE_STRATEGY_INTEGRATION_SMOKE.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit report to AstraQuant only
        if: success()
        working-directory: AstraQuant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SOURCE_STRATEGY_INTEGRATION_SMOKE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: record source strategy integration smoke"
          git pull --rebase origin main
          git push origin HEAD:main
