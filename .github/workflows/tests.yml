name: tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AstraQuant
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
