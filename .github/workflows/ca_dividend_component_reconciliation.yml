name: CA dividend reconciliation contract checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout AstraQuant
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --quiet -e . pytest

      - name: Run reconciliation contract tests
        run: python -m pytest -q tests/test_dividend_reconciliation.py tests/test_causal_raw_v2.py

      - name: Assert public workflow is data-free
        shell: bash
        run: |
          set -euo pipefail
          test ! -e private/astraquant/ca_dividend_component_reconciliation
          echo "CA row-level reconciliation is executed only in the authorized private delivery workflow."
