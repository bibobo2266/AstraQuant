name: VCP Round 1 full-trade sweep

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "run/vcp_round1.trigger"

permissions:
  contents: write

concurrency:
  group: research-effect-publication
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AstraQuant
        uses: actions/checkout@v4
        with:
          path: AstraQuant

      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          repository: bibobo2266/minervini_picks
          token: ${{ secrets.MINERVINI_READ_TOKEN }}
          path: source_runtime/minervini_picks
          persist-credentials: false
          sparse-checkout: |
            data/adj
            data/raw
            data/reference
            data/fundamentals
          sparse-checkout-cone-mode: true

      - name: Freeze source revision and permissions
        run: |
          echo "SOURCE_REVISION=$(git -C source_runtime/minervini_picks rev-parse HEAD)" >> "$GITHUB_ENV"
          chmod -R a-w source_runtime/minervini_picks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AstraQuant/pyproject.toml

      - name: Install AstraQuant
        working-directory: AstraQuant
        run: python -m pip install --quiet -e .

      - name: Run VCP round1 unit gate
        working-directory: AstraQuant
        run: pytest -q tests/test_vcp_round1.py

      - name: Run frozen E1 VCP round1
        working-directory: AstraQuant
        env:
          SOURCE_ROOT: ${{ github.workspace }}/source_runtime/minervini_picks/data
          SOURCE_REVISION: ${{ env.SOURCE_REVISION }}
          RESEARCH_EPOCH: E1
          SIGNAL_START: 2016-01-04
          SIGNAL_END: 2026-06-30
          SWEEP_PATH: configs/research/vcp_round1_three_segment_v1.yaml
        run: python scripts/source_vcp_round1.py

      - name: Verify artifact contract
        working-directory: AstraQuant
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd

          out = Path("out")
          summary = pd.read_csv(out / "vcp_sweep_round1.csv")
          assert len(summary) == 108
          assert summary["config_id"].nunique() == 108
          assert summary["low_n"].notna().all()

          trades = pd.read_csv(out / "vcp_sweep_round1_trades.csv")
          if len(trades):
              assert pd.to_datetime(trades["exit_date"]).max() <= pd.Timestamp("2021-12-31")

          opens = pd.read_csv(out / "vcp_sweep_round1_open_positions.csv")
          if len(opens):
              assert pd.to_datetime(opens["entry_date"]).max() <= pd.Timestamp("2021-12-31")

          charts = sorted(out.glob("vcp_round1_axis_*.png")) + sorted(out.glob("vcp_round1_heatmap_*.png"))
          assert len(charts) == 10
          assert all(p.stat().st_size > 0 for p in charts)

          manifest = json.loads((out / "vcp_sweep_round1_manifest.json").read_text())
          assert manifest["epoch"] == "E1"
          assert manifest["evaluated_combinations"] == 108
          assert all(x["match"] for x in manifest["batch_consistency"])
          PY

      - name: Upload VCP round1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vcp-round1-three-segment-v1
          path: |
            AstraQuant/out/vcp_sweep_round1*.csv
            AstraQuant/out/vcp_sweep_overlap.csv
            AstraQuant/out/vcp_round1_*.png
            AstraQuant/out/vcp_sweep_round1_manifest.json
            AstraQuant/docs/VCP_ROUND1_THREE_SEGMENT_V1.md

      - name: Commit governed results
        working-directory: AstraQuant
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CONTACT_REGISTRY.md docs/VCP_ROUND1_THREE_SEGMENT_V1.md out/
          git commit -m "report: record VCP round1 E1 sweep" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
