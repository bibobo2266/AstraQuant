name: PIT feature matrix layer1 review1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pit-feature-matrix-layer1-v1-review1
  cancel-in-progress: false

jobs:
  review:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout AstraQuant
        uses: actions/checkout@v4
        with:
          path: AstraQuant

      - name: Read frozen base source revision
        id: frozen
        working-directory: AstraQuant
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path("out/pit_feature_matrix_layer1_v1_manifest.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"source_revision={m['source_revision']}\n")
          PY

      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          repository: bibobo2266/minervini_picks
          token: ${{ secrets.MINERVINI_READ_TOKEN }}
          ref: ${{ steps.frozen.outputs.source_revision }}
          path: source_runtime/minervini_picks
          persist-credentials: false
          sparse-checkout: |
            data/adj
            data/raw
            data/reference
            data/fundamentals
            data/futures
          sparse-checkout-cone-mode: true

      - name: Freeze source permissions
        run: |
          echo "SOURCE_REVISION=${{ steps.frozen.outputs.source_revision }}" >> "$GITHUB_ENV"
          chmod -R a-w source_runtime/minervini_picks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AstraQuant/pyproject.toml

      - name: Install AstraQuant
        working-directory: AstraQuant
        run: python -m pip install --quiet -e ".[dev]"

      - name: Run review unit gate
        working-directory: AstraQuant
        run: pytest -q tests/test_pit_feature_matrix_layer1_review.py tests/test_pit_feature_matrix_layer1.py

      - name: Run review diagnostics only
        working-directory: AstraQuant
        env:
          SOURCE_ROOT: ${{ github.workspace }}/source_runtime/minervini_picks/data
          SOURCE_REVISION: ${{ env.SOURCE_REVISION }}
        run: python scripts/pit_feature_matrix_layer1_review.py

      - name: Verify review contract
        working-directory: AstraQuant
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          m=json.loads(Path("out/pit_feature_matrix_layer1_v1_review1_manifest.json").read_text())
          assert m["audit_rows"] >= 1000
          assert m["feature_data_rebuilt"] is False
          assert m["feature_values_changed"] is False
          assert m["round2_executed"] is False
          assert m["effect_metrics_computed"] is False
          assert m["availability_unknown"] > 0
          a=pd.read_csv("out/pit_feature_matrix_layer1_v1_review1_available_at_audit.csv")
          assert sorted(a.year.unique().tolist()) == [2016,2017,2018,2019,2020,2021]
          assert {"stock_features","market_context"} <= set(a.scope)
          e=pd.read_csv("out/pit_feature_matrix_layer1_v1_review1_availability_evidence.csv")
          assert not ((e.availability_status=="UNKNOWN") & (e.usable_for_exact_decision_time_pit==True)).any()
          PY

      - name: Upload review QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: pit-feature-matrix-layer1-v1-review1-${{ github.run_id }}
          path: |
            AstraQuant/out/pit_feature_matrix_layer1_v1_review1_*.csv
            AstraQuant/out/pit_feature_matrix_layer1_v1_review1_manifest.json
            AstraQuant/docs/PIT_FEATURE_MATRIX_LAYER1_V1_REVIEW1.md
          if-no-files-found: error
          retention-days: 90

      - name: Commit review QA outputs only
        working-directory: AstraQuant
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             docs/PIT_FEATURE_MATRIX_LAYER1_V1_REVIEW1.md             out/pit_feature_matrix_layer1_v1_review1_available_at_audit.csv             out/pit_feature_matrix_layer1_v1_review1_availability_evidence.csv             out/pit_feature_matrix_layer1_v1_review1_warmup_diagnostic.csv             out/pit_feature_matrix_layer1_v1_review1_coverage_comparison.csv             out/pit_feature_matrix_layer1_v1_review1_ma120_audit.csv             out/pit_feature_matrix_layer1_v1_review1_manifest.json
          git commit -m "report: record PIT feature matrix review1 [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
