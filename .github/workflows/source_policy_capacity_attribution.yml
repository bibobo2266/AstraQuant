name: Policy capacity attribution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source_policy_capacity_attribution.yml"
      - "scripts/source_policy_capacity_attribution.py"
      - "src/astraquant/portfolio/policy.py"
      - "src/astraquant/portfolio/strategy_simulator.py"
      - "src/astraquant/features/technical.py"
      - "docs/SOURCE_CA_PIT_EXCLUSIONS.csv"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout AstraQuant
        uses: actions/checkout@v4
        with:
          path: AstraQuant

      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          repository: bibobo2266/minervini_picks
          token: ${{ secrets.MINERVINI_READ_TOKEN }}
          path: source_runtime/minervini_picks
          persist-credentials: false

      - name: Make source checkout filesystem read-only
        run: chmod -R a-w source_runtime/minervini_picks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AstraQuant
        working-directory: AstraQuant
        run: python -m pip install --quiet -e .

      - name: Run deterministic policy capacity attribution
        working-directory: AstraQuant
        env:
          SOURCE_ROOT: ../source_runtime/minervini_picks/data
          REPORT_PATH: docs/SOURCE_POLICY_CAPACITY_ATTRIBUTION.md
          EXCLUSIONS_PATH: docs/SOURCE_CA_PIT_EXCLUSIONS.csv
          SIGNAL_START: "2016-01-04"
          SIGNAL_END: "2026-06-30"
        run: python scripts/source_policy_capacity_attribution.py

      - name: Publish summary
        working-directory: AstraQuant
        run: cat docs/SOURCE_POLICY_CAPACITY_ATTRIBUTION.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit report to AstraQuant only
        working-directory: AstraQuant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SOURCE_POLICY_CAPACITY_ATTRIBUTION.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "report: record policy capacity attribution"
          git pull --rebase origin main
          git push origin HEAD:main
