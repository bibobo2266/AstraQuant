name: Corporate action source profile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout AstraQuant
        uses: actions/checkout@v4
        with:
          path: AstraQuant
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          repository: bibobo2266/minervini_picks
          token: ${{ secrets.MINERVINI_READ_TOKEN }}
          path: source_runtime/minervini_picks
          persist-credentials: false
      - name: Make source checkout filesystem read-only
        run: chmod -R a-w source_runtime/minervini_picks
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --quiet pandas pyarrow
      - name: Profile corporate action source
        working-directory: AstraQuant
        env:
          SOURCE_ROOT: ../source_runtime/minervini_picks/data
          REPORT_PATH: docs/CORPORATE_ACTION_SOURCE_PROFILE.md
        run: python scripts/corporate_action_source_profile.py
      - name: Publish summary
        working-directory: AstraQuant
        run: cat docs/CORPORATE_ACTION_SOURCE_PROFILE.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report to AstraQuant only
        working-directory: AstraQuant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CORPORATE_ACTION_SOURCE_PROFILE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: profile corporate action source"
          git pull --rebase origin main
          git push origin HEAD:main
