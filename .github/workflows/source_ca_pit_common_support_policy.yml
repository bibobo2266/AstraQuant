name: CA PIT common-support policy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source_ca_pit_common_support_policy.yml"
      - "scripts/source_ca_pit_common_support_policy.py"
      - "scripts/source_eligible_universe_ca_coverage.py"
      - "scripts/source_strategy_integration_smoke.py"
      - "src/astraquant/data/corporate_actions.py"

permissions:
  contents: write

jobs:
  freeze-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout AstraQuant
        uses: actions/checkout@v4
        with:
          path: AstraQuant

      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          repository: bibobo2266/minervini_picks
          token: ${{ secrets.MINERVINI_READ_TOKEN }}
          path: source_runtime/minervini_picks
          persist-credentials: false

      - name: Make source checkout filesystem read-only
        run: chmod -R a-w source_runtime/minervini_picks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AstraQuant
        working-directory: AstraQuant
        run: python -m pip install --quiet -e .

      - name: Freeze CA/PIT common-support policy
        working-directory: AstraQuant
        env:
          SOURCE_ROOT: ../source_runtime/minervini_picks/data
          REPORT_PATH: docs/SOURCE_CA_PIT_COMMON_SUPPORT_POLICY.md
          EXCLUSIONS_PATH: docs/SOURCE_CA_PIT_EXCLUSIONS.csv
          SIGNAL_START: "2016-01-04"
          SIGNAL_END: "2026-06-30"
        run: python scripts/source_ca_pit_common_support_policy.py

      - name: Publish summary
        working-directory: AstraQuant
        run: cat docs/SOURCE_CA_PIT_COMMON_SUPPORT_POLICY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit policy evidence to AstraQuant only
        working-directory: AstraQuant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SOURCE_CA_PIT_COMMON_SUPPORT_POLICY.md docs/SOURCE_CA_PIT_EXCLUSIONS.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "report: freeze CA PIT common-support policy"
          git pull --rebase origin main
          git push origin HEAD:main
