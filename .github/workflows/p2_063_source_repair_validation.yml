name: P2-063 source repair validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/p2_063_source_repair_validation.py"
      - ".github/workflows/p2_063_source_repair_validation.yml"
      - "docs/SOURCE_CA_PIT_EXCLUSIONS.csv"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout AstraQuant
        uses: actions/checkout@v4
        with:
          path: AstraQuant

      - name: Checkout source read-only
        uses: actions/checkout@v4
        with:
          repository: bibobo2266/minervini_picks
          token: ${{ secrets.MINERVINI_READ_TOKEN }}
          path: source_runtime/minervini_picks
          persist-credentials: false
          sparse-checkout: |
            data/adj
            data/raw
            data/reference

      - name: Make source checkout filesystem read-only
        run: chmod -R a-w source_runtime/minervini_picks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AstraQuant
        working-directory: AstraQuant
        run: python -m pip install --quiet -e .

      - name: Validate P2-063 hard checks
        working-directory: AstraQuant
        env:
          SOURCE_ROOT: ../source_runtime/minervini_picks/data
          EXCLUSIONS_PATH: docs/SOURCE_CA_PIT_EXCLUSIONS.csv
          REPORT_PATH: docs/P2_063_SOURCE_REPAIR_VALIDATION.md
          SIGNAL_START: "2016-01-04"
          SIGNAL_END: "2026-06-30"
        run: python scripts/p2_063_source_repair_validation.py

      - name: Publish summary
        working-directory: AstraQuant
        run: cat docs/P2_063_SOURCE_REPAIR_VALIDATION.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit validation report
        working-directory: AstraQuant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/P2_063_SOURCE_REPAIR_VALIDATION.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "report: record P2-063 source repair validation"
          git pull --rebase origin main
          git push origin HEAD:main
