name: Source config sweep

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source_config_sweep.yml"
      - "scripts/source_config_sweep.py"
      - "src/astraquant/research/**"
      - "configs/research/**"
      - "configs/examples/universes/all_liquid.yaml"
      - "configs/examples/signals/high250_oneil_structure.yaml"
      - "configs/examples/exits/stop12_time250_executable.yaml"
      - "docs/SOURCE_CA_PIT_EXCLUSIONS.csv"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout AstraQuant
        uses: actions/checkout@v4
        with:
          path: AstraQuant

      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          repository: bibobo2266/minervini_picks
          token: ${{ secrets.MINERVINI_READ_TOKEN }}
          path: source_runtime/minervini_picks
          persist-credentials: false

      - name: Make source checkout filesystem read-only
        run: chmod -R a-w source_runtime/minervini_picks

      - name: Record source revision
        id: source
        working-directory: source_runtime/minervini_picks
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AstraQuant
        working-directory: AstraQuant
        run: python -m pip install --quiet -e .

      - name: Run generic config sweep
        working-directory: AstraQuant
        env:
          SOURCE_ROOT: ../source_runtime/minervini_picks/data
          SOURCE_REVISION: ${{ steps.source.outputs.sha }}
          SWEEP_PATH: configs/research/oneil_all_taiwan_surface.yaml
          REPORT_PATH: docs/SOURCE_ONEIL_TAIWAN_SWEEP.md
          CSV_PATH: docs/SOURCE_ONEIL_TAIWAN_SWEEP.csv
          EXCLUSIONS_PATH: docs/SOURCE_CA_PIT_EXCLUSIONS.csv
          SIGNAL_START: "2016-01-04"
          SIGNAL_END: "2026-06-30"
          FORWARD_SESSIONS: "250"
        run: python scripts/source_config_sweep.py

      - name: Publish summary
        working-directory: AstraQuant
        run: cat docs/SOURCE_ONEIL_TAIWAN_SWEEP.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit report to AstraQuant only
        working-directory: AstraQuant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SOURCE_ONEIL_TAIWAN_SWEEP.md docs/SOURCE_ONEIL_TAIWAN_SWEEP.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "report: record source config sweep"
          git pull --rebase origin main
          git push origin HEAD:main
