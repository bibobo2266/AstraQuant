name: VCP Round 1 amplitude3 diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "run/vcp_round1_amp3_diagnostic.trigger"

permissions:
  contents: write

concurrency:
  group: research-effect-publication
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AstraQuant
        uses: actions/checkout@v4
        with:
          path: AstraQuant

      - name: Read frozen round1 source revision
        id: frozen
        working-directory: AstraQuant
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path("out/vcp_sweep_round1_manifest.json").read_text())
          revision = str(manifest["source_revision"]).strip()
          if not revision:
              raise SystemExit("missing source_revision")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"source_revision={revision}\n")
          PY

      - name: Checkout frozen immutable source
        uses: actions/checkout@v4
        with:
          repository: bibobo2266/minervini_picks
          token: ${{ secrets.MINERVINI_READ_TOKEN }}
          ref: ${{ steps.frozen.outputs.source_revision }}
          path: source_runtime/minervini_picks
          persist-credentials: false
          sparse-checkout: |
            data/adj
            data/raw
            data/reference
            data/fundamentals
          sparse-checkout-cone-mode: true

      - name: Freeze source permissions
        run: |
          echo "SOURCE_REVISION=${{ steps.frozen.outputs.source_revision }}" >> "$GITHUB_ENV"
          chmod -R a-w source_runtime/minervini_picks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AstraQuant/pyproject.toml

      - name: Install AstraQuant
        working-directory: AstraQuant
        run: python -m pip install --quiet -e ".[dev]"

      - name: Run VCP round1 and round2 unit gates
        working-directory: AstraQuant
        run: pytest -q tests/test_vcp_round1.py tests/test_vcp_round2.py

      - name: Run frozen round1 amplitude3 diagnostic
        working-directory: AstraQuant
        env:
          SOURCE_ROOT: ${{ github.workspace }}/source_runtime/minervini_picks/data
          SOURCE_REVISION: ${{ env.SOURCE_REVISION }}
          SIGNAL_START: 2016-01-04
          SIGNAL_END: 2026-06-30
        run: python scripts/source_vcp_round1_amp3_diagnostic.py

      - name: Verify diagnostic contract and frozen round1 outputs
        working-directory: AstraQuant
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          d = pd.read_csv("out/vcp_round1_amp3_diagnostic.csv", dtype={"stock_id": str})
          required = {
              "config_id", "base_len", "last_contraction", "dry_up",
              "breakout_vol", "stock_id", "signal_date",
              "amplitude_1", "amplitude_2", "amplitude_3",
              "amplitude3_eq_0", "amplitude3_lt_0_01", "entered_trade",
          }
          assert required <= set(d.columns)
          summary = pd.read_csv("out/vcp_sweep_round1.csv")
          assert len(d) == int(summary["signal_count"].sum())
          assert d["config_id"].nunique() == 108
          PY
          git diff --exit-code --             out/vcp_sweep_round1.csv             out/vcp_sweep_round1_trades.csv             out/vcp_sweep_round1_open_positions.csv             out/vcp_sweep_round1_manifest.json             configs/research/vcp_round1_three_segment_v1.yaml             configs/examples/signals/vcp_round1_three_segment_v1.yaml

      - name: Upload amplitude3 diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: vcp-round1-amp3-diagnostic
          path: AstraQuant/out/vcp_round1_amp3_diagnostic.csv

      - name: Commit diagnostic only
        working-directory: AstraQuant
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/vcp_round1_amp3_diagnostic.csv docs/CONTACT_REGISTRY.md
          git commit -m "diagnostic: record frozen round1 amplitude3 audit" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
