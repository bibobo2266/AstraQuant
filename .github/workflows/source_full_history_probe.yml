name: Source full history canonical probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source_full_history_probe.yml"
      - "scripts/source_full_history_probe.py"
      - "src/astraquant/data/source_adapter.py"
      - "src/astraquant/execution/market_data.py"
      - "src/astraquant/portfolio/historical_runner.py"
      - "src/astraquant/portfolio/replay_runner.py"
      - "src/astraquant/portfolio/corporate_actions.py"
      - "src/astraquant/portfolio/valuation.py"

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout AstraQuant
        uses: actions/checkout@v4
        with:
          path: AstraQuant

      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          repository: bibobo2266/minervini_picks
          token: ${{ secrets.MINERVINI_READ_TOKEN }}
          path: source_runtime/minervini_picks
          persist-credentials: false

      - name: Make source checkout filesystem read-only
        run: chmod -R a-w source_runtime/minervini_picks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AstraQuant
        working-directory: AstraQuant
        run: python -m pip install --quiet -e .

      - name: Run full-history canonical accounting probe
        working-directory: AstraQuant
        env:
          SOURCE_ROOT: ../source_runtime/minervini_picks/data
          REPORT_PATH: docs/SOURCE_FULL_HISTORY_PROBE.md
          REPLAY_TICKER: "2330"
          START_YEAR: "2015"
          END_YEAR: "2026"
        run: python scripts/source_full_history_probe.py

      - name: Publish summary
        working-directory: AstraQuant
        run: cat docs/SOURCE_FULL_HISTORY_PROBE.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit report to AstraQuant only
        working-directory: AstraQuant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SOURCE_FULL_HISTORY_PROBE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: record source full-history canonical probe"
          git pull --rebase origin main
          git push origin HEAD:main
