name: Legacy breakout NAV regression

on:
  workflow_dispatch:
  # 這支是「拿舊版已確認的 NAV 當基準，確認改完還是同一個數」。
  # 只有動到計算層才有意義，改文件或丟資料不需要重跑。
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "configs/**"
      - "pyproject.toml"
      - ".github/workflows/legacy_breakout_regression.yml"

concurrency:
  group: legacy-breakout-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    # 實際平均約 4.2 分；原本 90 分的保險絲太鬆。
    timeout-minutes: 20
    steps:
      - name: Checkout AstraQuant
        uses: actions/checkout@v4
        with:
          path: AstraQuant

      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          repository: bibobo2266/minervini_picks
          token: ${{ secrets.MINERVINI_READ_TOKEN }}
          path: source_runtime/minervini_picks
          persist-credentials: false
          sparse-checkout: |
            data/adj
            data/raw
            data/reference
            data/fundamentals

      - name: Make source checkout filesystem read-only
        run: chmod -R a-w source_runtime/minervini_picks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AstraQuant
        working-directory: AstraQuant
        run: python -m pip install --quiet -e .

      - name: Boolean final NAV regression only
        working-directory: AstraQuant
        env:
          SOURCE_ROOT: ../source_runtime/minervini_picks/data
          SIGNAL_START: "2016-01-04"
          SIGNAL_END: "2026-06-30"
        run: python scripts/source_legacy_breakout_regression.py
