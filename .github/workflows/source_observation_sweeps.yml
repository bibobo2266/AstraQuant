name: Source five candidate path diagnostics

on:
  workflow_dispatch:
    inputs:
      research_epoch:
        description: "Effect epoch: E1 (default) or E2. E3 is blocked by governance."
        required: false
        default: "E1"

concurrency:
  group: source-five-candidate-path-diagnostics
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    if: ${{ false }}
    # Software-only integration commits may opt out of real-data effect sweeps.
    # Explicit workflow_dispatch remains available for authorized research runs.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout AstraQuant
        uses: actions/checkout@v4
        with:
          path: AstraQuant

      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          repository: bibobo2266/minervini_picks
          token: ${{ secrets.MINERVINI_READ_TOKEN }}
          path: source_runtime/minervini_picks
          persist-credentials: false
          sparse-checkout: |
            data/adj
            data/raw
            data/reference
            data/fundamentals

      - name: Make source checkout filesystem read-only
        run: chmod -R a-w source_runtime/minervini_picks

      - name: Record source revision
        id: source
        working-directory: source_runtime/minervini_picks
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AstraQuant
        working-directory: AstraQuant
        run: python -m pip install --quiet -e .

      - name: Run Bollinger daily sweep
        working-directory: AstraQuant
        env:
          SOURCE_ROOT: ../source_runtime/minervini_picks/data
          SOURCE_REVISION: ${{ steps.source.outputs.sha }}
          SWEEP_PATH: configs/research/observations/bollinger_daily_surface.yaml
          REPORT_PATH: docs/SOURCE_BOLLINGER_DAILY_SWEEP.md
          CSV_PATH: docs/SOURCE_BOLLINGER_DAILY_SWEEP.csv
          EXCLUSIONS_PATH: docs/SOURCE_CA_PIT_EXCLUSIONS.csv
          SIGNAL_START: "2016-01-04"
          SIGNAL_END: "2026-06-30"
          OUTCOME_DIRECTION: "LONG"
          RESEARCH_EPOCH: ${{ github.event.inputs.research_epoch || 'E1' }}
        run: python scripts/source_path_diagnostics.py

      - name: Run VCP daily sweep
        working-directory: AstraQuant
        env:
          SOURCE_ROOT: ../source_runtime/minervini_picks/data
          SOURCE_REVISION: ${{ steps.source.outputs.sha }}
          SWEEP_PATH: configs/research/observations/vcp_daily_surface.yaml
          REPORT_PATH: docs/SOURCE_VCP_DAILY_SWEEP.md
          CSV_PATH: docs/SOURCE_VCP_DAILY_SWEEP.csv
          EXCLUSIONS_PATH: docs/SOURCE_CA_PIT_EXCLUSIONS.csv
          SIGNAL_START: "2016-01-04"
          SIGNAL_END: "2026-06-30"
          OUTCOME_DIRECTION: "LONG"
          RESEARCH_EPOCH: ${{ github.event.inputs.research_epoch || 'E1' }}
        run: python scripts/source_path_diagnostics.py

      - name: Run Anchor-up daily sweep
        working-directory: AstraQuant
        env:
          SOURCE_ROOT: ../source_runtime/minervini_picks/data
          SOURCE_REVISION: ${{ steps.source.outputs.sha }}
          SWEEP_PATH: configs/research/observations/anchor_up_daily_surface.yaml
          REPORT_PATH: docs/SOURCE_ANCHOR_UP_DAILY_SWEEP.md
          CSV_PATH: docs/SOURCE_ANCHOR_UP_DAILY_SWEEP.csv
          EXCLUSIONS_PATH: docs/SOURCE_CA_PIT_EXCLUSIONS.csv
          SIGNAL_START: "2016-01-04"
          SIGNAL_END: "2026-06-30"
          OUTCOME_DIRECTION: "LONG"
          RESEARCH_EPOCH: ${{ github.event.inputs.research_epoch || 'E1' }}
        run: python scripts/source_path_diagnostics.py

      - name: Run Anchor-down daily sweep
        working-directory: AstraQuant
        env:
          SOURCE_ROOT: ../source_runtime/minervini_picks/data
          SOURCE_REVISION: ${{ steps.source.outputs.sha }}
          SWEEP_PATH: configs/research/observations/anchor_down_daily_surface.yaml
          REPORT_PATH: docs/SOURCE_ANCHOR_DOWN_DAILY_SWEEP.md
          CSV_PATH: docs/SOURCE_ANCHOR_DOWN_DAILY_SWEEP.csv
          EXCLUSIONS_PATH: docs/SOURCE_CA_PIT_EXCLUSIONS.csv
          SIGNAL_START: "2016-01-04"
          SIGNAL_END: "2026-06-30"
          OUTCOME_DIRECTION: "SHORT"
          RESEARCH_EPOCH: ${{ github.event.inputs.research_epoch || 'E1' }}
        run: python scripts/source_path_diagnostics.py

      - name: Run RSI daily sweep
        working-directory: AstraQuant
        env:
          SOURCE_ROOT: ../source_runtime/minervini_picks/data
          SOURCE_REVISION: ${{ steps.source.outputs.sha }}
          SWEEP_PATH: configs/research/observations/rsi_daily_surface.yaml
          REPORT_PATH: docs/SOURCE_RSI_DAILY_SWEEP.md
          CSV_PATH: docs/SOURCE_RSI_DAILY_SWEEP.csv
          EXCLUSIONS_PATH: docs/SOURCE_CA_PIT_EXCLUSIONS.csv
          SIGNAL_START: "2016-01-04"
          SIGNAL_END: "2026-06-30"
          OUTCOME_DIRECTION: "LONG"
          RESEARCH_EPOCH: ${{ github.event.inputs.research_epoch || 'E1' }}
        run: python scripts/source_path_diagnostics.py

      - name: Publish summaries
        working-directory: AstraQuant
        shell: bash
        run: |
          cat docs/SOURCE_BOLLINGER_DAILY_SWEEP.md >> "$GITHUB_STEP_SUMMARY"
          cat docs/SOURCE_VCP_DAILY_SWEEP.md >> "$GITHUB_STEP_SUMMARY"
          cat docs/SOURCE_ANCHOR_UP_DAILY_SWEEP.md >> "$GITHUB_STEP_SUMMARY"
          cat docs/SOURCE_ANCHOR_DOWN_DAILY_SWEEP.md >> "$GITHUB_STEP_SUMMARY"
          cat docs/SOURCE_RSI_DAILY_SWEEP.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit reports to AstraQuant only
        working-directory: AstraQuant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             docs/SOURCE_BOLLINGER_DAILY_SWEEP.md docs/SOURCE_BOLLINGER_DAILY_SWEEP.csv             docs/SOURCE_VCP_DAILY_SWEEP.md docs/SOURCE_VCP_DAILY_SWEEP.csv             docs/SOURCE_ANCHOR_UP_DAILY_SWEEP.md docs/SOURCE_ANCHOR_UP_DAILY_SWEEP.csv             docs/SOURCE_ANCHOR_DOWN_DAILY_SWEEP.md docs/SOURCE_ANCHOR_DOWN_DAILY_SWEEP.csv             docs/SOURCE_RSI_DAILY_SWEEP.md docs/SOURCE_RSI_DAILY_SWEEP.csv             docs/CONTACT_REGISTRY.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "report: record source observation sweeps"
          git pull --rebase origin main
          git push origin HEAD:main
