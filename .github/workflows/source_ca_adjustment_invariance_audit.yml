name: CA adjustment invariance audit

on:
  push:
    branches: [main]
    paths:
      - "run/ca_adjustment_invariance_audit_v1.trigger"

permissions:
  contents: write

concurrency:
  group: ca-adjustment-invariance-audit-v1
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout AstraQuant
        uses: actions/checkout@v4
        with:
          path: AstraQuant

      - name: Checkout frozen source
        uses: actions/checkout@v4
        with:
          repository: bibobo2266/minervini_picks
          token: ${{ secrets.MINERVINI_READ_TOKEN }}
          ref: fb8b042b46dc38838d103544ca17da10286c7bfe
          path: source_runtime/minervini_picks
          persist-credentials: false
          sparse-checkout: |
            data/adj
            data/raw
            data/reference
          sparse-checkout-cone-mode: true

      - name: Freeze source permissions
        run: |
          echo "SOURCE_REVISION=$(git -C source_runtime/minervini_picks rev-parse HEAD)" >> "$GITHUB_ENV"
          chmod -R a-w source_runtime/minervini_picks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AstraQuant/pyproject.toml

      - name: Install AstraQuant
        working-directory: AstraQuant
        run: python -m pip install --quiet -e ".[dev]"

      - name: Run unit gate
        working-directory: AstraQuant
        run: pytest -q tests/test_ca_adjustment_audit.py

      - name: Run E1 no-effect audit
        working-directory: AstraQuant
        env:
          SOURCE_ROOT: ${{ github.workspace }}/source_runtime/minervini_picks/data
          SOURCE_REVISION: ${{ env.SOURCE_REVISION }}
        run: python scripts/source_ca_adjustment_invariance_audit.py

      - name: Verify audit-only contract
        working-directory: AstraQuant
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          m=json.loads(Path("out/ca_adjustment_invariance_manifest.json").read_text())
          assert m["epoch"]=="E1"
          assert m["formal_universe_modified"] is False
          assert m["formal_feature_artifact_rebuilt"] is False
          assert m["strategy_effect_metrics_computed"] is False
          assert m["e2_e3_effects_queried"] is False
          y=pd.read_csv("out/ca_adjustment_invariance_yearly.csv")
          assert y.year.tolist()==[2016,2017,2018,2019,2020,2021]
          assert (y.comparable_price_rows>0).all()
          c=pd.read_csv("out/ca_adjustment_invariance_feature_classification.csv")
          assert "close_to_ma120" in set(c.column)
          assert "N_SESSION_HIGH_60" in set(c.column)
          banned={"net_return","win_rate","expectancy","forward_return","exit_price"}
          for p in [
              Path("out/ca_adjustment_invariance_yearly.csv"),
              Path("out/ca_adjustment_invariance_cases.csv"),
              Path("out/ca_adjustment_invariance_feature_classification.csv"),
          ]:
              cols=set(pd.read_csv(p,nrows=1).columns)
              assert not (cols & banned), (p, cols & banned)
          PY

      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ca-adjustment-invariance-audit-v1-${{ github.run_id }}
          path: |
            AstraQuant/docs/CA_ADJUSTMENT_INVARIANCE_AUDIT.md
            AstraQuant/out/ca_adjustment_invariance_yearly.csv
            AstraQuant/out/ca_adjustment_invariance_cases.csv
            AstraQuant/out/ca_adjustment_invariance_feature_classification.csv
            AstraQuant/out/ca_adjustment_invariance_manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Commit audit outputs only
        working-directory: AstraQuant
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             docs/CA_ADJUSTMENT_INVARIANCE_AUDIT.md             out/ca_adjustment_invariance_yearly.csv             out/ca_adjustment_invariance_cases.csv             out/ca_adjustment_invariance_feature_classification.csv             out/ca_adjustment_invariance_manifest.json
          git commit -m "report: record CA adjustment invariance audit [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
