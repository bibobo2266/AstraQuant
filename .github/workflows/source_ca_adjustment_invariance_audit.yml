name: CA adjustment invariance audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "run/ca_adjustment_invariance_audit.trigger"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout AstraQuant
        uses: actions/checkout@v4
        with:
          path: AstraQuant

      - name: Checkout frozen source
        uses: actions/checkout@v4
        with:
          repository: bibobo2266/minervini_picks
          ref: fb8b042b46dc38838d103544ca17da10286c7bfe
          token: ${{ secrets.MINERVINI_READ_TOKEN }}
          path: source_runtime/minervini_picks
          persist-credentials: false
          sparse-checkout: |
            data/adj
            data/raw
            data/reference
          sparse-checkout-cone-mode: true

      - name: Freeze source revision
        run: |
          test "$(git -C source_runtime/minervini_picks rev-parse HEAD)" = "fb8b042b46dc38838d103544ca17da10286c7bfe"
          echo "SOURCE_REVISION=$(git -C source_runtime/minervini_picks rev-parse HEAD)" >> "$GITHUB_ENV"
          chmod -R a-w source_runtime/minervini_picks

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AstraQuant/pyproject.toml

      - name: Install
        working-directory: AstraQuant
        run: python -m pip install --quiet -e ".[dev]"

      - name: Run audit unit gate
        working-directory: AstraQuant
        run: pytest -q tests/test_ca_adjustment_invariance_audit.py

      - name: Run E1 data and signal consistency audit
        working-directory: AstraQuant
        env:
          SOURCE_ROOT: ${{ github.workspace }}/source_runtime/minervini_picks/data
          SOURCE_REVISION: ${{ env.SOURCE_REVISION }}
        run: python scripts/source_ca_adjustment_invariance_audit.py

      - name: Verify no-effect audit contract
        working-directory: AstraQuant
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          m=json.loads(Path("out/ca_adjustment_invariance_manifest.json").read_text())
          assert m["epoch"]=="E1"
          assert m["no_effect_metrics"] is True
          assert m["strategy_runs_executed"]==[]
          assert m["factor_only_results"]["ma120_value_diffs"]==0
          assert m["factor_only_results"]["ma120_gate_flips"]==0
          assert m["factor_only_results"]["n60_signal_flips"]==0
          banned={"outcome","forward_return","net_return","win_rate","expectancy","exit_date","exit_price"}
          for p in Path("out").glob("ca_adjustment_invariance_*.csv"):
              cols=set(pd.read_csv(p,nrows=2).columns)
              assert not (cols & banned), (p,cols & banned)
          assert Path("docs/CA_ADJUSTMENT_INVARIANCE_AUDIT.md").exists()
          PY

      - name: Upload audit QA
        uses: actions/upload-artifact@v4
        with:
          name: ca-adjustment-invariance-audit-${{ github.run_id }}
          path: |
            AstraQuant/docs/CA_ADJUSTMENT_INVARIANCE_AUDIT.md
            AstraQuant/out/ca_adjustment_invariance_*.csv
            AstraQuant/out/ca_adjustment_invariance_manifest.json
          retention-days: 90

      - name: Commit audit report
        working-directory: AstraQuant
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CA_ADJUSTMENT_INVARIANCE_AUDIT.md out/ca_adjustment_invariance_*
          git commit -m "report: record CA adjustment invariance audit" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
