name: PIT feature matrix layer1

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Frozen S1/input exports or Owner-approved fixed S3 continuation"
        required: false
        default: s1
        type: choice
        options:
          - s1
          - s3_source_preflight
          - s3_limit_inputs
          - s3_accounting_inputs
          - s3_resume
      s3_chain:
        description: "Authorized S3 chain identity; retain across continuation"
        required: false
        default: s3-actions-20261011
      s3_segment:
        description: "Zero-based S3 segment; maximum 72, initial 0 is real SIGKILL pilot"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: pit-feature-matrix-layer1-v1
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/trading-plan-r1' && inputs.stage != 's3_resume' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout AstraQuant
        uses: actions/checkout@v4
        with:
          path: AstraQuant
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Checkout immutable source snapshot
        uses: actions/checkout@v4
        with:
          repository: bibobo2266/minervini_picks
          ref: 3e7c4b6d9cde3b18942710fa977db02f89bffa0d
          token: ${{ secrets.MINERVINI_READ_TOKEN }}
          path: source_runtime/minervini_picks
          persist-credentials: false
          sparse-checkout: |
            data/adj
            data/raw
            data/reference
            data/fundamentals
            data/futures
          sparse-checkout-cone-mode: true

      - name: Freeze source revision and permissions
        shell: bash
        run: |
          SOURCE_REVISION="$(git -C source_runtime/minervini_picks rev-parse HEAD)"
          test -n "$SOURCE_REVISION"
          echo "SOURCE_REVISION=$SOURCE_REVISION" >> "$GITHUB_ENV"
          chmod -R a-w source_runtime/minervini_picks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AstraQuant/pyproject.toml

      - name: Install AstraQuant
        working-directory: AstraQuant
        run: python -m pip install --quiet -e ".[dev]"

      - name: Synthetic panel and R1 unit checks
        working-directory: AstraQuant
        run: |
          python -m unittest discover -s tests -p test_eligibility_panel_s1.py -v
          python -m unittest discover -s tests -p test_trading_plan_r1.py -v

      - name: Build E1 eligibility panel and ten source comparisons
        if: ${{ inputs.stage == 's1' }}
        working-directory: AstraQuant
        env:
          SOURCE_ROOT: ${{ github.workspace }}/source_runtime/minervini_picks/data
          SOURCE_REVISION: ${{ env.SOURCE_REVISION }}
          BUILD_ELIGIBILITY_PANEL: "1"
        run: python scripts/source_pit_feature_matrix_layer1.py

      - name: S3 source-only preflight (no effects)
        if: ${{ inputs.stage == 's3_source_preflight' }}
        working-directory: AstraQuant
        env:
          SOURCE_ROOT: ${{ github.workspace }}/source_runtime/minervini_picks/data
          SOURCE_REVISION: ${{ env.SOURCE_REVISION }}
          S3_SOURCE_PREFLIGHT: "1"
        run: python scripts/source_pit_feature_matrix_layer1.py

      - name: Verify limit formulas and export frozen inputs (no effects)
        if: ${{ inputs.stage == 's3_limit_inputs' }}
        working-directory: AstraQuant
        env:
          SOURCE_ROOT: ${{ github.workspace }}/source_runtime/minervini_picks/data
          SOURCE_REVISION: ${{ env.SOURCE_REVISION }}
          S3_LIMIT_INPUTS: "1"
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/source_pit_feature_matrix_layer1.py

      - name: Accounting export path unit checks
        if: ${{ inputs.stage == 's3_accounting_inputs' }}
        working-directory: AstraQuant
        run: python -m pytest -q tests/test_s3_accounting_input_export.py

      - name: Export complete immutable accounting inputs (no effects)
        if: ${{ inputs.stage == 's3_accounting_inputs' }}
        working-directory: AstraQuant
        env:
          SOURCE_ROOT: ${{ github.workspace }}/source_runtime/minervini_picks/data
          SOURCE_REVISION: ${{ env.SOURCE_REVISION }}
          S3_ACCOUNTING_INPUTS: "1"
        run: python scripts/source_pit_feature_matrix_layer1.py

      - name: Upload panel and source comparisons
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: eligibility-panel-s1-${{ github.run_id }}
          path: |
            AstraQuant/data/panel/eligibility_panel.parquet
            AstraQuant/out/eligibility_panel_*.csv
            AstraQuant/out/eligibility_panel_manifest.json
            AstraQuant/out/trading_plan_r1_s3_source_preflight.csv
            AstraQuant/out/limit_rule_inputs/
            AstraQuant/out/s3_accounting_inputs/accounting_source_inputs.zip
            AstraQuant/out/s3_accounting_inputs/input_manifest.json
            AstraQuant/out/s3_accounting_inputs/archive_receipt.json
            AstraQuant/configs/research/pit_feature_matrix_layer1_v1.yaml
          if-no-files-found: warn
          retention-days: 90

  s3_resume:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/trading-plan-r1' && inputs.stage == 's3_resume' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      S3_CHAIN: ${{ inputs.s3_chain }}
      S3_SEGMENT: ${{ inputs.s3_segment }}
    steps:
      - name: Start bounded S3 wall clock
        run: echo "S3_JOB_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout latest durable S3 generation
        uses: actions/checkout@v4
        with:
          path: AstraQuant
          ref: research/trading-plan-r1
          persist-credentials: false

      - name: Set up Python for S3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AstraQuant/pyproject.toml

      - name: Install S3 runtime
        working-directory: AstraQuant
        run: python -m pip install --quiet -e ".[dev]"

      - name: Restore accepted S1 artifact without rebuilding
        uses: actions/download-artifact@v4
        with:
          repository: bibobo2266/AstraQuant
          github-token: ${{ github.token }}
          run-id: 37708776526
          artifact-ids: 11520573912
          path: fixed-inputs/s1
          merge-multiple: true

      - name: Restore accepted accounting export without refreshing sources
        uses: actions/download-artifact@v4
        with:
          repository: bibobo2266/AstraQuant
          github-token: ${{ github.token }}
          run-id: 37769333701
          artifact-ids: 11547312869
          path: fixed-inputs/accounting
          merge-multiple: true

      - name: Verify orchestration safeguards
        working-directory: AstraQuant
        run: python -m pytest -q tests/test_s3_actions_continuation.py tests/test_s3_diagnostic_runner_finish.py tests/test_s3_checkpoint_efficiency.py tests/test_s3_terminal_calendar.py

      - name: Execute real interruption pilot or bounded S3 continuation
        id: s3
        working-directory: AstraQuant
        run: python scripts/run_s3_actions.py --phase execute --workspace "$GITHUB_WORKSPACE" --chain "$S3_CHAIN" --segment "$S3_SEGMENT"

      - name: Upload S3 receipts and new immutable checkpoint parts
        id: s3_artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: s3-${{ inputs.s3_chain }}-${{ inputs.s3_segment }}-${{ github.run_id }}
          path: AstraQuant/s3-action-artifact/
          if-no-files-found: error
          retention-days: ${{ steps.s3.outputs.complete == 'true' && 90 || 7 }}
          compression-level: 6

      - name: Continue same workflow only after verified artifact upload
        if: ${{ success() }}
        working-directory: AstraQuant
        env:
          S3_ARTIFACT_ID: ${{ steps.s3_artifact.outputs.artifact-id }}
        run: python scripts/run_s3_actions.py --phase continue --chain "$S3_CHAIN" --segment "$S3_SEGMENT" --artifact-id "$S3_ARTIFACT_ID"

      - name: Preserve raw S3 failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: s3-error-${{ github.run_id }}
          path: |
            AstraQuant/results/trading_plan_r1/s3_live_20261011/actions_error.json
            AstraQuant/results/trading_plan_r1/s3_live_20261011/actions_chain.json
            AstraQuant/results/trading_plan_r1/s3_live_20261011/A/progress.json
            AstraQuant/results/trading_plan_r1/s3_live_20261011/B/progress.json
          if-no-files-found: warn
          retention-days: 7

      - name: Report failed Actions run on sole delivery issue
        if: ${{ failure() }}
        working-directory: AstraQuant
        run: |
          gh api --method POST repos/bibobo2266/AstraQuant/issues/6/comments --silent \
            -f body="Sol-E｜Actions失敗停止，無自動重啟；原始錯誤請讀 https://github.com/bibobo2266/AstraQuant/actions/runs/$GITHUB_RUN_ID 。"
