name: Governed canonical strategy performance report

on:
  workflow_dispatch:
    inputs:
      run_config:
        description: "Optional single run config (e.g. configs/research/runs/vcp_all_liquid_stop12_time250.yaml). Empty = legacy breakout + every run config."
        required: false
        default: ""
      research_epoch:
        description: "Effect epoch: E1 (default) or E2. E3 is blocked by governance."
        required: false
        default: "E1"

concurrency:
  group: research-effect-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    if: ${{ false }}
    # Software/data-only maintenance may opt out of strategy-effect execution.
    # workflow_dispatch remains explicit and is never blocked by this marker.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout AstraQuant
        uses: actions/checkout@v4
        with:
          path: AstraQuant

      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          repository: bibobo2266/minervini_picks
          token: ${{ secrets.MINERVINI_READ_TOKEN }}
          path: source_runtime/minervini_picks
          persist-credentials: false
          sparse-checkout: |
            data/adj
            data/raw
            data/reference
            data/fundamentals
            data/futures

      - name: Make source checkout filesystem read-only
        run: chmod -R a-w source_runtime/minervini_picks

      - name: Record source revision
        id: source
        working-directory: source_runtime/minervini_picks
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AstraQuant
        working-directory: AstraQuant
        run: python -m pip install --quiet -e .

      - name: Run performance reports
        working-directory: AstraQuant
        shell: bash
        env:
          SOURCE_ROOT: ../source_runtime/minervini_picks/data
          SOURCE_REVISION: ${{ steps.source.outputs.sha }}
          SIGNAL_START: "2016-01-04"
          SIGNAL_END: "2026-06-30"
          DRAIN_SESSIONS: "5"
          RESEARCH_EPOCH: ${{ github.event.inputs.research_epoch || 'E1' }}
          ONLY_CONFIG: ${{ github.event.inputs.run_config }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          if [ -n "${ONLY_CONFIG:-}" ]; then
            if [ ! -f "${ONLY_CONFIG}" ]; then
              echo "FAIL: run_config not found: ${ONLY_CONFIG}"
              exit 1
            fi
            echo "::group::${ONLY_CONFIG}"
            RUN_CONFIG="${ONLY_CONFIG}" python scripts/source_strategy_performance_report.py
            echo "::endgroup::"
            exit 0
          fi

          echo "::group::legacy breakout governed report"
          python scripts/source_strategy_performance_report.py
          echo "::endgroup::"

          configs=(configs/research/runs/*.yaml configs/research/runs/*.yml)
          if [ ${#configs[@]} -eq 0 ]; then
            echo "no run configs found under configs/research/runs/"
          fi
          for cfg in "${configs[@]}"; do
            echo "::group::${cfg}"
            RUN_CONFIG="${cfg}" python scripts/source_strategy_performance_report.py
            echo "::endgroup::"
          done

      - name: Publish summaries
        if: always()
        working-directory: AstraQuant
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for report in docs/SOURCE_*STRATEGY_PERFORMANCE*.md; do
            cat "${report}" >> "$GITHUB_STEP_SUMMARY"
            printf '\n\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Commit reports to AstraQuant only
        working-directory: AstraQuant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "report: record config strategy performance"
          git pull --rebase origin main
          git push origin HEAD:main
