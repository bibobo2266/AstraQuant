schema_version: "1"
name: vcp_round1_three_segment_v1
universes:
  - configs/examples/universes/all_liquid.yaml
signal: configs/examples/signals/vcp_round1_three_segment_v1.yaml
exit: configs/examples/exits/vcp_round1_atr21_d21.yaml
axes:
  - target: trigger.base_len
    values: [25, 35, 50, 65]
  - target: trigger.last_contraction
    values: [0.08, 0.12, 0.15]
  - target: trigger.dry_up
    values: [0.50, 0.65, 0.80]
  - target: trigger.breakout_vol
    values: [1.5, 2.0, 2.5]
constraints: []
execution_assumptions_id: vcp-round1-costs-v1
fixed_settings:
  epoch: E1
  entry_timing: NEXT_COMMON_OPEN
  entry_chase_multiple: 1.05
  normalized_initial_notional: 1.0
  reentry_cooldown_sessions: 0
  one_open_trade_per_config_ticker: true
  cross_stock_capital_competition: false
  buy_fee_bps: 14.25
  sell_fee_bps_including_tax: 44.25
  adverse_slippage_bps_each_side: 10.0
  settlement_lag_sessions: 2
  low_n_closed_trades: 100
  high_score_fraction: 0.25
  overlap_top_trades: 20
  overlap_warning_threshold: 0.60
  remove_top_profit_counts: [1, 3, 5]
  adjustment_method: ADJUSTED_RESEARCH_INDICATORS_RAW_EXECUTION_CA_ACCOUNTING
  pilot_config_count: 2
  batch_consistency_sample_count: 3
max_combinations: 108
report_trade_stats_first: true
