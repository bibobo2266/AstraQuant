schema_version: '1'
name: baseline_qullamaggie_v1
provenance:
  source: gpwork4u/qullamaggie-tw-backtest STRATEGY.md
  method: Qullamaggie 台股版 高位整理突破
  parameter_origin: TRANSLATED — 從公開實作抄錄的參數，非老手原話，也非已驗證的有效值
  captured: '2026-09-30'
trigger:
  type: BREAKOUT_N_DAY_HIGH
  params:
    breakout_window: 15
    price_field: CLOSE
    exclude_today: true
filters:
- type: VOLUME_MULTIPLE
  params:
    vol_window: 20
    vol_mult: 1.5
- type: RETURN_OVER_N_DAYS
  params:
    window: 60
    min_return: 0.3
- type: RETURN_OVER_N_DAYS
  params:
    window: 120
    min_return: 0.2
- type: PCT_FROM_N_DAY_HIGH
  params:
    window: 60
    max_pct: 0.1
- type: MA_STACK
  params:
    fast: 50
    slow: 100
    average: SMA
- type: CONSOLIDATION_ATR_CONTRACTION
  params:
    min_days: 10
    max_drawdown: 0.25
    atr_window: 20
- type: ENTRY_DAY_STRENGTH_CAP
  params:
    atr_window: 20
    max_atr_multiple: 0.6667
- type: EXCLUDE_LIMIT_UP
  params:
    limit_pct: 0.1
ranking: []
