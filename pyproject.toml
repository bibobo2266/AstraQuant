[project]
name = "astraquant"
version = "0.1.0"
description = "Human-in-the-loop investment research and validation operating system"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "pydantic>=2.7",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "matplotlib>=3.8"
]

[project.optional-dependencies]
ml = ["lightgbm>=4.3"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
